spring.application.name=filemanagement

spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/file_management_db}
spring.datasource.username=${DB_USERNAME:sfms_user}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080
jwt.secret=${JWT_SECRET:dev-secret-for-secure-file-management-system-change-later-2026}
jwt.expiration-ms=86400000
