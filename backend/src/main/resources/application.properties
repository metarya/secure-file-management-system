spring.application.name=filemanagement

spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/file_management_db}
spring.datasource.username=${DB_USERNAME:sfms_user}
spring.datasource.password=${DB_PASSWORD}

# Flyway is now the single owner of schema changes (see db/migration). Hibernate
# must NOT alter the schema, so we use `validate`: at startup Hibernate only
# checks that the entity mappings match the Flyway-managed tables and fails fast
# on any drift, instead of silently issuing ALTER statements (`update`).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway database migrations. baseline-on-migrate lets Flyway adopt an existing,
# non-empty schema by stamping a baseline version instead of failing. Migrations
# live under the default location classpath:db/migration (added in a later phase).
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

server.port=8080
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# CORS: comma-separated list of exact SPA origins (no wildcards). Override per
# environment via the CORS_ALLOWED_ORIGINS env var.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000,https://secure-file-vault-2026.vercel.app}

# Upload limits — Spri  ng defaults are 1MB/file and 10MB/request, which block
# PDFs, audio and video. Keep MySQL max_allowed_packet >= this value.
spring.servlet.multipart.max-file-size=1GB
spring.servlet.multipart.max-request-size=1GB

spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587

spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Sender ("From") address used for outgoing emails.
mail.from=${MAIL_FROM}

# SFTP host key verification. Set this to the absolute path of an OpenSSH
# known_hosts file that contains trusted host keys for all SFTP servers that
# users may connect to. Strict host key checking is always enabled; leaving this
# property unset will cause all SFTP connections to fail.
# Populate via: ssh-keyscan -H <sftp-host> >> <path>
sftp.known-hosts-path=${SFTP_KNOWN_HOSTS_PATH:}

# ---------------------------------------------------------------------------
# Storage-credential encryption
# ---------------------------------------------------------------------------
# Symmetric key used to encrypt storage-provider secrets at rest (S3 access
# keys, SFTP passwords, OAuth tokens, etc.).
#
# DEV profile  — a built-in development key is used automatically. Never use
#                it in production. See application-dev.properties.
#
# PROD profile — APP_STORAGE_ENCRYPTION_KEY *must* be set. The application
#                will refuse to start if the variable is absent or blank.
#
# The salt below is a fixed hex string used as a PBKDF2 KDF parameter
# (not a secret). Changing it invalidates all existing encrypted credentials,
# so leave it fixed unless you are intentionally rotating and re-encrypting.
app.storage.encryption-salt=${APP_STORAGE_ENCRYPTION_SALT:5c0744940b5c369b}