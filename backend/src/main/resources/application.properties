spring.application.name=filemanagement

spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/file_management_db}
spring.datasource.username=${DB_USERNAME:sfms_user}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# Upload limits — Spring defaults are 1MB/file and 10MB/request, which block
# PDFs, audio and video. Keep MySQL max_allowed_packet >= this value.
spring.servlet.multipart.max-file-size=1GB
spring.servlet.multipart.max-request-size=1GB

spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587

spring.mail.username=ab5f30001@smtp-brevo.com
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true