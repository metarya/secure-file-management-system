# === Datasource: H2 in-memory with MySQL dialect hints ===
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Let Hibernate generate the schema from entity definitions.
# Flyway migrations use MySQL-specific DDL and cannot run against H2.
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Security
jwt.secret=test-jwt-secret-key-that-is-long-enough-for-hmac-sha256-minimum-32-chars

# Mail — supply placeholder values so Spring does not fail on unresolved ${...}
# expressions. EmailService is @MockBean in integration tests so no real SMTP
# connection is ever attempted.
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=test@example.com
spring.mail.password=test-password
mail.from=test@example.com

# Redis — StringRedisTemplate is replaced with @MockBean; no real Redis needed.
spring.data.redis.host=localhost
spring.data.redis.port=6370

# Silence logs that are irrelevant to integration test output
logging.level.com.project.filemanagement=WARN
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
